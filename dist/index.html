<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e35"><title>王者荣耀 · 克制选人</title><link rel="icon" type="image/png" sizes="128x128" href="./favicon-bp.png"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-bp.png"><link rel="stylesheet" href="./style.css"></head><body>
<div class="topbar"><div class="header-inner"><header class="masthead"><h1>王者荣耀 <span>克制选人</span></h1><div><button id="undo" disabled>撤销</button><button id="reset">清空</button><button id="about">说明</button></div></header><section class="opponents" aria-label="对方选了谁"><div class="opponent-heading"><h2>对方选了谁 <span id="enemy-count">0 / 5</span></h2><span>点已选头像移除</span></div><div id="enemies" class="enemy-slots"></div></section></div></div><main class="workspace">
<section class="counter-section" aria-label="克制候选一排"><div class="role-heading"><h2>我玩哪路</h2><span>决定克制候选</span></div><div class="role-toggle" role="radiogroup" aria-label="我的分路"><button role="radio" data-lane="对抗路" aria-checked="true" tabindex="0">对抗路</button><button role="radio" data-lane="打野" aria-checked="false" tabindex="-1">打野</button><button role="radio" data-lane="中路" aria-checked="false" tabindex="-1">中路</button><button role="radio" data-lane="发育路" aria-checked="false" tabindex="-1">发育路</button><button role="radio" data-lane="游走" aria-checked="false" tabindex="-1">游走</button></div><div class="result-heading"><h2>这条分路可选谁</h2><div class="candidate-paging"><span id="counter-count"></span><button id="prev-candidates" aria-label="上一组克制候选">上一组</button><button id="next-candidates" aria-label="下一组克制候选">下一组</button></div></div><p id="ranking-note" class="ranking-note">先选对方英雄，结果即时更新</p>
<section id="recommendations" class="ranking" aria-label="克制英雄列表"><p class="loading">正在读取本地资料…</p></section></section>
<div class="board"><div class="pool-heading"><h2>点选对方英雄</h2><span id="result-count"></span></div><div class="hero-panel"><div id="pool-lanes" class="pool-tabs" role="tablist" aria-label="对方英雄池分路"><button id="pool-tab-0" role="tab" data-pool-lane="全部" aria-selected="true" aria-controls="heroes" tabindex="0">全部</button><button id="pool-tab-1" role="tab" data-pool-lane="对抗路" aria-selected="false" aria-controls="heroes" tabindex="-1">对抗路</button><button id="pool-tab-2" role="tab" data-pool-lane="打野" aria-selected="false" aria-controls="heroes" tabindex="-1">打野</button><button id="pool-tab-3" role="tab" data-pool-lane="中路" aria-selected="false" aria-controls="heroes" tabindex="-1">中路</button><button id="pool-tab-4" role="tab" data-pool-lane="发育路" aria-selected="false" aria-controls="heroes" tabindex="-1">发育路</button><button id="pool-tab-5" role="tab" data-pool-lane="游走" aria-selected="false" aria-controls="heroes" tabindex="-1">游走</button></div>
<section id="heroes" class="heroes" role="tabpanel" aria-labelledby="pool-tab-0"></section></div></div><span id="save-status" class="save-status">自动保存</span></main>
<dialog id="search-dialog" aria-labelledby="search-title"><div class="about-header"><h2 id="search-title">搜索对方英雄</h2><button id="close-search">关闭</button></div><div class="search-row"><input type="search" id="search" aria-label="搜索英雄" placeholder="中文名 / 拼音 / 简称" autocomplete="off"><button id="clear-search">清除</button></div><p id="search-count" class="search-count"></p><div id="search-results" class="search-results"></div></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2>清空对方选择？</h2><p>清空后仍可撤销。</p><div class="dialog-actions"><button value="cancel" autofocus>保留当前</button><button value="confirm" class="primary">确认清空</button></div></form></dialog>
<dialog id="about-dialog"><div class="about-header"><h2>资料说明</h2><button id="close-about">关闭</button></div><div class="about-content" id="about-content"></div></dialog><dialog id="reason-dialog"><div class="about-header"><h2 id="reason-title">克制依据</h2><button id="close-reason">关闭</button></div><div class="about-content" id="reason-content"></div></dialog><div id="notice" class="notice" role="status" hidden></div><script type="module" src="./app.js"></script></body></html>
